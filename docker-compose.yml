services:
  mongo_1:
    build: .
    image: mongocustom:8.0.1
    container_name: mongodb1
    hostname: mongodb1
    networks:
      - mongonet
    ports:
      - "27017:27017"
    user: mongodb
    volumes:
      - mongo-db-data-1:/data/db
      - mongo-configdb-data-1:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=absolute_cinema
    command: mongod --config /etc/mongod.conf --port 27017
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27017" , "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo_2:
    build: .
    image: mongocustom:8.0.1
    container_name: mongodb2
    hostname: mongodb2
    networks:
      - mongonet
    ports:
      - "27018:27018"
    user: mongodb
    volumes:
      - mongo-db-data-2:/data/db
      - mongo-configdb-data-2:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=absolute_cinema
    command: mongod --config /etc/mongod.conf --port 27018
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27018" , "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo_3:
    build: .
    image: mongocustom:8.0.1
    container_name: mongodb3
    hostname: mongodb3
    networks:
      - mongonet
    ports:
      - "27019:27019"
    user: mongodb
    volumes:
      - mongo-db-data-3:/data/db
      - mongo-configdb-data-3:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=absolute_cinema
    command: mongod --config /etc/mongod.conf --port 27019
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27019" , "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
  mongoinit:
    build: .
    image: mongocustom:8.0.1
    hostname: mongodbinit
    container_name: mongodbinit
    networks:
      - mongonet
    user: mongodb
    depends_on:
      mongo_1:
        condition: service_healthy
      mongo_2:
        condition: service_healthy
      mongo_3:
        condition: service_healthy
    command: >
      mongosh --host mongodb1:27017 --username admin --password adminpassword --authenticationDatabase admin --eval
      '
      rs.initiate(
        {
          _id: "replica_set_single",
          version: 1,
          members: [
            { _id: 0, host : "mongodb1:27017" },
            { _id: 1, host : "mongodb2:27018" },
            { _id: 2, host : "mongodb3:27019" }
          ]
        }
      );
      '
  redis:
    image: redis/redis-stack:latest
    container_name: redis_cache
    hostname: redis_cache
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    networks:
      - mongonet
    environment:
      REDIS_PASSWORD: adminpassword
  
  kafka1:
    image: apache/kafka:3.7.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9192:9192"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9192,INTERNAL://:19192,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9192,INTERNAL://kafka1:19192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      CLUSTER_ID: NTg2OWZhNzY3NDhjMTFlZG
    volumes:
      - kafka1-data:/var/kafka-logs
    networks:
      - kafka-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9192 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  kafka2:
    image: apache/kafka:3.7.0
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9292:9292"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: EXTERNAL://:9292,INTERNAL://:19292,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9292,INTERNAL://kafka2:19292
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      CLUSTER_ID: NTg2OWZhNzY3NDhjMTFlZG
    volumes:
      - kafka2-data:/var/kafka-logs
    networks:
      - kafka-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9292 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  kafka3:
    image: apache/kafka:3.7.0
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9392:9392"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: EXTERNAL://:9392,INTERNAL://:19392,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9392,INTERNAL://kafka3:19392
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      CLUSTER_ID: NTg2OWZhNzY3NDhjMTFlZG
    volumes:
      - kafka3-data:/var/kafka-logs
    networks:
      - kafka-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9392 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: absolute-cinema-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19192,kafka2:19292,kafka3:19392
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-network
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    networks:
      - kafka-network
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sleep 10

        EXISTING_TOPICS=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:19192 --list 2>/dev/null)

          
          /opt/kafka/bin/kafka-topics.sh --create \
            --bootstrap-server kafka1:19192 \
            --topic tickets \
            --partitions 3 \
            --replication-factor 3 \
            --config min.insync.replicas=2 \
            --config retention.ms=604800000
          
        fi

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:19192 --describe --topic tickets

networks:
  mongonet:
    driver: bridge
  kafka-network:
    driver: bridge

volumes:
  mongo-db-data-1:
  mongo-configdb-data-1:
  mongo-db-data-2:
  mongo-configdb-data-2:
  mongo-db-data-3:
  mongo-configdb-data-3:
  redis-data:
  kafka1-data:
  kafka2-data:
  kafka3-data: